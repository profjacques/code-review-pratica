<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Problema: Container genérico sem tags semânticas (header/main) -->
  <div id="app">
    <!-- Problema: Estilo inline misturado no HTML -->
    <h1 style="color: blue; text-align: center;">Minhas Tarefas</h1>

    <div class="box-input">
      <input type="text" id="taskInput" placeholder="O que você precisa fazer?">
      
      <!-- Problema Crítico: <div> fingindo ser botão com onclick inline -->
      <div id="btn-add" onclick="addTask()">Salvar Tarefa</div>
      
      <!-- Botão que chama a função de estilo inline do JS -->
      <button onclick="red()">Destacar Lista</button>
    </div>

    <!-- Problema de acessibilidade: lista sem atributos ARIA ou identificação clara -->
    <ul id="list">
      <!-- Itens gerados dinamicamente via script.js -->
    </ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
